<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* HEARTS */
.heart{
    position:absolute;
    width:20px;
    height:20px;
    background:red;
    transform:rotate(45deg);
    animation:float 6s infinite;
}
.heart:before,.heart:after{
    content:'';
    position:absolute;
    width:20px;
    height:20px;
    background:red;
    border-radius:50%;
}
.heart:before{top:-10px;left:0;}
.heart:after{left:-10px;top:0;}

@keyframes float{
    0%{bottom:-10%;opacity:0;}
    50%{opacity:1;}
    100%{bottom:110%;opacity:0;}
}

.box{
    background:#fff;
    width:92%;
    max-width:450px;
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 30px rgba(0,0,0,.25);
    display:none;
    animation:fadeIn 1.5s ease;
}

.box.active{display:block;}

@keyframes fadeIn{
    from{opacity:0;transform:scale(.9);}
    to{opacity:1;transform:scale(1);}
}

h1{color:#ff4d6d;}
p{color:#444;font-size:15px;line-height:1.6;}

input{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    margin-top:15px;
    padding:10px 25px;
    border:none;
    border-radius:20px;
    background:#ff4d6d;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

.images img{
    width:100%;
    border-radius:15px;
    margin-top:10px;
}

.typing{
    border-right:2px solid #ff4d6d;
    white-space:pre-wrap;
    overflow:hidden;
}
</style>
</head>

<body>

<!-- floating hearts -->
<script>
for(let i=0;i<20;i++){
    let h=document.createElement('div');
    h.className='heart';
    h.style.left=Math.random()*100+'%';
    h.style.animationDelay=Math.random()*5+'s';
    document.body.appendChild(h);
}
</script>

<!-- PASSWORD -->
<div class="box active" id="login">
<h1>🔒 Private</h1>
<p>Enter Password</p>
<input type="password" id="pass">
<button onclick="unlock()">Open 💕</button>
</div>

<!-- OPENING -->
<div class="box" id="open">
<h1 class="typing" id="openText"></h1>
<button onclick="next('gallery')">Continue 💖</button>
</div>

<!-- IMAGES -->
<div class="box" id="gallery">
<h1>Memories 📸</h1>
<div class="images">
<img src="img1.jpg">
<img src="img2.jpg">
<img src="img3.jpg">
<img src="img4.jpg">
<img src="img5.jpg">
</div>
<button onclick="next('part1')">Next 💌</button>
</div>

<!-- TEXT PART 1 -->
<div class="box" id="part1">
<p class="typing" id="t1"></p>
<button onclick="next('part2')">Next ➡️</button>
</div>

<!-- TEXT PART 2 -->
<div class="box" id="part2">
<p class="typing" id="t2"></p>
<button onclick="next('part3')">Next ➡️</button>
</div>

<!-- TEXT PART 3 -->
<div class="box" id="part3">
<p class="typing" id="t3"></p>
<h1>❤️ Forever Grateful ❤️</h1>
</div>

<script>
function unlock(){
 if(document.getElementById('pass').value==="love0501"){
   show('open');
   typeText("openText","Happy Birthday Mardal Pilla 💕💖");
 } else alert("Wrong password 💔");
}

function show(id){
 document.querySelectorAll('.box').forEach(b=>b.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}

function next(id){ show(id); }

function typeText(el,text){
 let i=0;
 let target=document.getElementById(el);
 target.innerHTML="";
 let timer=setInterval(()=>{
   target.innerHTML+=text.charAt(i);
   i++;
   if(i>=text.length) clearInterval(timer);
 },40);
}

/* YOUR TEXT */
typeText("t1",`Happy happy happy birthday ne potti ☺️❤️🥰
Its about 05th January 2026.
Elanti Day unttadhi ani Expect cheyyale...
Anno memories tho unnam...`);

typeText("t2",`Mana journey 2nd year July 31st ki start ayindhi...
Everything is destiny...
Always with you as a well wisher and good friend for life long.`);

typeText("t3",`E 7 months training time lo life lo full twists...
At the end of the day kalise unnam...
Pandhi vi nuvvu 😂🫣 thittukoku malla 😄`);
</script>

</body>
</html>
