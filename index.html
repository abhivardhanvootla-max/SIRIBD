<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    background:#fff;
    width:90%;
    max-width:420px;
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 30px rgba(0,0,0,.25);
    display:none;
}

.box.active{display:block;}

h1{color:#ff4d6d;}
p{color:#444;}

input,textarea{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:15px;
}

button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background:#ff4d6d;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

.images img{
    width:100%;
    border-radius:15px;
    margin-top:10px;
}
</style>
</head>

<body>

<!-- PASSWORD PAGE -->
<div class="box active" id="loginBox">
    <h1>🔒 Private Surprise</h1>
    <p>Enter the secret password</p>
    <input type="password" id="password" placeholder="Password">
    <button onclick="check()">Open 💖</button>
</div>

<!-- MAIN PAGE -->
<div class="box" id="mainBox">
    <h1>Happy Birthday ❤️</h1>
    <p>
        Today is special because <br>
        <b>YOU were born 💕</b><br><br>
        Thank you for being my happiness, my smile, my everything 🌸
    </p>

    <div class="images">
        <img src="img1.jpg">
        <img src="img2.jpg">
        <img src="img3.jpg">
        <img src="img4.jpg">
        <img src="img5.jpg">
    </div>

    <textarea rows="4" placeholder="Write your reply here 💌"></textarea>
</div>

<script>
function check(){
    const pass = document.getElementById("password").value;
    if(pass === "love123"){
        document.getElementById("loginBox").classList.remove("active");
        document.getElementById("mainBox").classList.add("active");
    }else{
        alert("Wrong password 💔");
    }
}
</script>

</body>
</html>
