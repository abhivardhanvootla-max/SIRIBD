<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    background:#fff;
    width:92%;
    max-width:420px;
    padding:20px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 15px 30px rgba(0,0,0,.25);
    display:none;
}
.box.active{display:block;}

h1{color:#ff4d6d;}

button{
    margin:8px;
    padding:10px 18px;
    border:none;
    border-radius:20px;
    background:#ff4d6d;
    color:white;
    font-size:15px;
    cursor:pointer;
}

/* SLIDESHOW */
#slide{
    width:100%;
    border-radius:15px;
    margin-top:10px;
}
</style>
</head>

<body>

<!-- PASSWORD -->
<div class="box active" id="login">
<h1>🔒 Private</h1>
<input type="password" id="pass" placeholder="Password">
<button onclick="unlock()">Open 💕</button>
</div>

<!-- OPEN -->
<div class="box" id="open">
<h1>Happy Birthday Mardal Pilla 💕💖</h1>
<button onclick="showBox('gallery')">Continue 💖</button>
</div>

<!-- SLIDESHOW -->
<div class="box" id="gallery">
<h1>Memories 📸</h1>

<img id="slide" src="img1.jpg">

<div>
    <button onclick="prev()">⬅️ Previous</button>
    <button onclick="next()">Next ➡️</button>
</div>

<button onclick="showBox('end')">Continue 💌</button>
</div>

<!-- END -->
<div class="box" id="end">
<h1>❤️ Always Special ❤️</h1>
<p>Happy Birthday once again 🎂</p>
</div>

<script>
/* navigation */
function showBox(id){
    document.querySelectorAll('.box').forEach(b=>b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* password */
function unlock(){
    if(document.getElementById("pass").value==="love0501"){
        showBox("open");
    }else{
        alert("Wrong password");
    }
}

/* slideshow logic */
let images = [
    "img1.jpg",
    "img2.jpg",
    "img3.jpg",
    "img4.jpg",
    "img5.jpg"
];
let i = 0;

function next(){
    i++;
    if(i >= images.length){ i = 0; }
    document.getElementById("slide").src = images[i];
}

function prev(){
    i--;
    if(i < 0){ i = images.length - 1; }
    document.getElementById("slide").src = images[i];
}
</script>

</body>
</html>
